server {
    listen 80;
    listen [::]:80;
    server_name tech-blog.27k.online;

    root /var/www/k7_blog;
    index index.html;
    charset utf-8;

    add_header Cache-Control "no-cache";

    location / {
        try_files $uri $uri/ =404;
    }

    location ^~ /_astro/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
