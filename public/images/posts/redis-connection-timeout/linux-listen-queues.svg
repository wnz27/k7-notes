<svg width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="redis-queue-path-title redis-queue-path-desc">
<title id="redis-queue-path-title">新连接经过内核队列再由 Redis 接收</title><desc id="redis-queue-path-desc">本图展示集群中一个目标 Redis 节点的连接路径。SYN 队列与 accept 队列均位于该节点所在机器的 Linux 内核中；tcp-backlog 与 somaxconn 共同约束同一个 accept 队列。</desc>
<defs>
<marker id="redis-queue-path-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
<marker id="redis-queue-path-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
<marker id="redis-queue-path-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
</defs><rect width="1280" height="720" fill="#f5f5f5"/><text x="48" y="40" fill="#4f5d75" font-size="14" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="start">仅展开新建 TCP 连接：健康连接复用不重复经过监听队列。</text><rect x="288" y="192" width="608" height="272" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.12)" stroke-width="1" /><text x="304" y="216" fill="#5a6580" font-size="14" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="start">目标 Redis 节点所在机器的 Linux 内核</text><line x1="248" y1="272" x2="336" y2="272" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#redis-queue-path-arrow)"/><line x1="248" y1="320" x2="336" y2="320" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#redis-queue-path-arrow)"/><line x1="248" y1="368" x2="336" y2="368" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#redis-queue-path-arrow)"/><line x1="536" y1="320" x2="608" y2="320" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#redis-queue-path-arrow)"/><line x1="848" y1="320" x2="1008" y2="320" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#redis-queue-path-arrow)"/><path d="M 640 144 V 176 Q 640 184 648 184 H 680 Q 688 184 688 192 V 224" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#redis-queue-path-arrow)"/><path d="M 848 144 V 176 Q 848 184 840 184 H 776 Q 768 184 768 192 V 224" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#redis-queue-path-arrow)"/><line x1="728" y1="416" x2="728" y2="520" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#redis-queue-path-arrow)"/><rect x="260" y="292" width="64" height="20" rx="2" fill="#f5f5f5" /><text x="292.0" y="305" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, Menlo, monospace" font-weight="400" text-anchor="middle">NEW TCP</text><rect x="548" y="292" width="48" height="20" rx="2" fill="#f5f5f5" /><text x="572.0" y="305" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, Menlo, monospace" font-weight="400" text-anchor="middle">ACK</text><rect x="892" y="292" width="72" height="20" rx="2" fill="#f5f5f5" /><text x="928.0" y="305" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, Menlo, monospace" font-weight="400" text-anchor="middle">ACCEPT</text><rect x="736" y="456" width="104" height="20" rx="2" fill="#f5f5f5" /><text x="788.0" y="469" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, Menlo, monospace" font-weight="400" text-anchor="middle">FULL: NEW SYN</text><rect x="48" y="224" width="200" height="192" rx="6" fill="#f5f5f5" /><rect x="48" y="224" width="200" height="192" rx="6" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1" /><text x="64" y="248" fill="#2d3142" font-size="12" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="start">ad 引擎连接池</text><text x="64" y="276" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, Menlo, monospace" font-weight="400" text-anchor="start">ATTEMPT A</text><text x="64" y="324" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, Menlo, monospace" font-weight="400" text-anchor="start">ATTEMPT B</text><text x="64" y="372" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, Menlo, monospace" font-weight="400" text-anchor="start">ATTEMPT C</text><text x="64" y="400" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, Menlo, monospace" font-weight="400" text-anchor="start">pool miss → dial</text><rect x="336" y="224" width="200" height="192" rx="6" fill="#f5f5f5" /><rect x="336" y="224" width="200" height="192" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1" /><rect x="348" y="236" width="48" height="16" rx="2" fill="none" stroke="#4f5d75" stroke-width="1" /><text x="372" y="247" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, Menlo, monospace" font-weight="500" text-anchor="middle">KERNEL</text><text x="436.0" y="272" fill="#2d3142" font-size="12" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="middle">SYN 队列</text><text x="436.0" y="289" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, Menlo, monospace" font-weight="400" text-anchor="middle">tcp_max_syn_backlog</text><text x="436" y="344" fill="#4f5d75" font-size="12" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="400" text-anchor="middle">握手尚未完成</text><text x="436" y="376" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, Menlo, monospace" font-weight="400" text-anchor="middle">SYN_RECV</text><rect x="608" y="224" width="240" height="192" rx="6" fill="#f5f5f5" /><rect x="608" y="224" width="240" height="192" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1" /><rect x="620" y="236" width="48" height="16" rx="2" fill="none" stroke="#bf4520" stroke-width="1" /><text x="644" y="247" fill="#bf4520" font-size="8" font-family="'Geist Mono', ui-monospace, Menlo, monospace" font-weight="500" text-anchor="middle">KERNEL</text><text x="728.0" y="272" fill="#2d3142" font-size="12" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="middle">accept 队列</text><text x="728.0" y="289" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, Menlo, monospace" font-weight="400" text-anchor="middle">B ≈ min(request, cap)</text><rect x="632" y="312" width="32" height="32" rx="4" fill="rgba(45,49,66,0.12)" stroke="#4f5d75" stroke-width="1" /><rect x="672" y="312" width="32" height="32" rx="4" fill="rgba(45,49,66,0.12)" stroke="#4f5d75" stroke-width="1" /><rect x="712" y="312" width="32" height="32" rx="4" fill="rgba(45,49,66,0.12)" stroke="#4f5d75" stroke-width="1" /><rect x="752" y="312" width="32" height="32" rx="4" fill="rgba(45,49,66,0.12)" stroke="#4f5d75" stroke-width="1" /><rect x="792" y="312" width="32" height="32" rx="4" fill="rgba(45,49,66,0.12)" stroke="#4f5d75" stroke-width="1" /><text x="728" y="372" fill="#4f5d75" font-size="12" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="400" text-anchor="middle">Q = B（示意满队列）</text><text x="728" y="396" fill="#4f5d75" font-size="12" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="400" text-anchor="middle">同一内核监听队列</text><rect x="560" y="64" width="160" height="80" rx="6" fill="#f5f5f5" /><rect x="560" y="64" width="160" height="80" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1" /><rect x="572" y="76" width="48" height="16" rx="2" fill="none" stroke="#4f5d75" stroke-width="1" /><text x="596" y="87" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, Menlo, monospace" font-weight="500" text-anchor="middle">CONFIG</text><text x="640.0" y="112" fill="#2d3142" font-size="12" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="middle">应用请求</text><text x="640.0" y="129" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, Menlo, monospace" font-weight="400" text-anchor="middle">tcp-backlog</text><rect x="768" y="64" width="160" height="80" rx="6" fill="#f5f5f5" /><rect x="768" y="64" width="160" height="80" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1" /><rect x="780" y="76" width="48" height="16" rx="2" fill="none" stroke="#4f5d75" stroke-width="1" /><text x="804" y="87" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, Menlo, monospace" font-weight="500" text-anchor="middle">CONFIG</text><text x="848.0" y="112" fill="#2d3142" font-size="12" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="middle">内核上限</text><text x="848.0" y="129" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, Menlo, monospace" font-weight="400" text-anchor="middle">somaxconn</text><rect x="1008" y="224" width="240" height="192" rx="6" fill="#f5f5f5" /><rect x="1008" y="224" width="240" height="192" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1" /><rect x="1020" y="236" width="48" height="16" rx="2" fill="none" stroke="#4f5d75" stroke-width="1" /><text x="1044" y="247" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, Menlo, monospace" font-weight="500" text-anchor="middle">PROCESS</text><text x="1128.0" y="272" fill="#2d3142" font-size="12" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="middle">Redis accept()</text><text x="1128.0" y="289" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, Menlo, monospace" font-weight="400" text-anchor="middle">service rate: μ conn/s</text><text x="1128" y="344" fill="#4f5d75" font-size="12" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="400" text-anchor="middle">取走连接后初始化、读取命令</text><text x="1128" y="376" fill="#4f5d75" font-size="12" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="400" text-anchor="middle">用户态事件循环</text><rect x="608" y="520" width="240" height="80" rx="6" fill="#f5f5f5" /><rect x="608" y="520" width="240" height="80" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1" /><rect x="620" y="532" width="48" height="16" rx="2" fill="none" stroke="#4f5d75" stroke-width="1" /><text x="644" y="543" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, Menlo, monospace" font-weight="500" text-anchor="middle">OUTCOME</text><text x="728.0" y="568" fill="#2d3142" font-size="12" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="middle">新连接可能失败</text><text x="728.0" y="585" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, Menlo, monospace" font-weight="400" text-anchor="middle">drop / retry → dial timeout</text><text x="872" y="556" fill="#4f5d75" font-size="12" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="400" text-anchor="start">满时可能丢新 SYN；</text><text x="872" y="580" fill="#4f5d75" font-size="12" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="400" text-anchor="start">不表示把队列里的连接批量丢弃。</text><line x1="48" y1="648" x2="1232" y2="648" stroke="rgba(45,49,66,0.12)"/><line x1="48" y1="680" x2="96" y2="680" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#redis-queue-path-arrow)"/><text x="112" y="685" fill="#4f5d75" font-size="12" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="400" text-anchor="start">实线：新建连接路径</text><line x1="384" y1="680" x2="432" y2="680" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#redis-queue-path-arrow)"/><text x="448" y="685" fill="#4f5d75" font-size="12" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="400" text-anchor="start">虚线：配置约束或满队列影响</text><rect x="848" y="672" width="16" height="12" rx="2" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1" /><text x="876" y="685" fill="#4f5d75" font-size="12" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="400" text-anchor="start">重点：每个监听 socket 的 accept 队列</text></svg>
