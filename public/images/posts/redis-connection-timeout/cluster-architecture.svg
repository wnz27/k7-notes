<svg width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="redis-architecture-title redis-architecture-desc">
<title id="redis-architecture-title">一个 ad 引擎如何访问 Redis Cluster</title><desc id="redis-architecture-desc">ad 引擎中的客户端维护槽位映射和每节点连接池，并直接连接分布在不同主机上的 Redis 分片。</desc>
